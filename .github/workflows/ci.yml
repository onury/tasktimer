name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: [22, 24]
    steps:
      - uses: actions/checkout@v4
      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
      # npm 10 (bundled with Node 22) crashes resolving vitest's peer graph:
      # "Cannot read properties of null (reading 'edgesOut')". npm 11 fixes it.
      - run: npm i -g npm@11
      - run: npm install
      - run: npm run build
      - run: npm test
